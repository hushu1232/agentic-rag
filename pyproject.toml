[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG service with routing, multi-hop planning and offline evaluation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.28",
  "pydantic>=2.7",
  "openai>=1.40",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
